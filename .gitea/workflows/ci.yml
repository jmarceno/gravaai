name: CI

# Manual dispatch: fmt/clippy/tests + AppImage pack smoke test.
on:
  workflow_dispatch:

jobs:
  rust-checks:
    name: fmt + clippy + tests
    runs-on: ubuntu-latest
    container: archlinux:latest
    steps:
      - name: Install toolchain + system deps
        run: |
          pacman -Syu --noconfirm git base-devel rust \
            gtk4 libadwaita libnotify libpulse pipewire-pulse ffmpeg curl

      - uses: actions/checkout@v6

      - name: cargo fmt check
        run: cargo fmt --check --manifest-path linux/Cargo.toml

      - name: cargo clippy (deny warnings)
        run: cargo clippy --manifest-path linux/Cargo.toml --all-targets -- -D warnings

      - name: cargo test
        run: cargo test --manifest-path linux/Cargo.toml

  appimage-build:
    name: ${{ matrix.arch }} Build AppImage + smoke test
    runs-on: ${{ matrix.runner }}
    needs: rust-checks
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-latest
          - arch: aarch64
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v6

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential curl file desktop-file-utils \
            libgtk-4-dev libadwaita-1-dev libpulse-dev libglib2.0-dev

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Build AppImage
        run: |
          export APPIMAGE_EXTRACT_AND_RUN=1
          unset APPIMAGE APPDIR || true
          ./linux/packaging/appimage/build-appimage.sh 0.0.0 "$PWD/appimage-out"

      - name: Verify AppImage and smoke-test
        run: |
          unset APPIMAGE APPDIR || true
          export APPIMAGE_EXTRACT_AND_RUN=1
          IMG="appimage-out/gravaai-0.0.0-${{ matrix.arch }}.AppImage"
          test -x "$IMG"
          "$IMG" --install 'garbage' || test $? -eq 2
          echo "AppImage runs OK"
