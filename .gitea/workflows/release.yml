name: release

# MANUAL ONLY: run it from the repo's Actions tab ("Run workflow").
# Never add push / tag / schedule / pull_request triggers here or in any
# other workflow: nothing in this repo may run without a human starting it.
#
# Releases the version in linux/Cargo.toml as tag v<version> on the selected
# branch's current commit, with the portable .run and SHA256SUMS attached.
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Read version
        id: version
        run: |
          version="$(grep -m1 -E '^version\s*=' linux/Cargo.toml | sed -E 's/.*"([^"]+)".*/\1/')"
          echo "tag=v$version" >> "$GITHUB_OUTPUT"

      - name: Refuse to overwrite an existing release
        env:
          API: ${{ gitea.server_url }}/api/v1/repos/${{ gitea.repository }}
          TOKEN: ${{ secrets.GITEA_TOKEN }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          code="$(curl -sS -o /dev/null -w '%{http_code}' -H "Authorization: token $TOKEN" "$API/releases/tags/$TAG")"
          if [ "$code" = 200 ]; then
            echo "Release $TAG already exists; bump version in linux/Cargo.toml first." >&2
            exit 1
          fi

      - name: Build portable bundle (glibc 2.35 container)
        run: ./scripts/build-portable.sh --container

      - name: Smoke portable bundle
        run: ./scripts/smoke-portable.sh build/portable/*-portable.run

      - name: Create release and upload assets
        env:
          API: ${{ gitea.server_url }}/api/v1/repos/${{ gitea.repository }}
          TOKEN: ${{ secrets.GITEA_TOKEN }}
          TAG: ${{ steps.version.outputs.tag }}
          SHA: ${{ gitea.sha }}
        run: |
          set -euo pipefail
          mkdir -p dist
          cp build/portable/*-portable.run dist/
          (cd dist && sha256sum ./*.run > SHA256SUMS)
          auth="Authorization: token $TOKEN"
          body="$(jq -n --arg tag "$TAG" --arg sha "$SHA" '{tag_name: $tag, target_commitish: $sha, name: $tag}')"
          id="$(curl -fsS -H "$auth" -H 'Content-Type: application/json' -d "$body" "$API/releases" | jq -er .id)"
          for f in dist/*; do
            name="$(basename "$f")"
            curl -fsS -H "$auth" -H 'Content-Type: application/octet-stream' \
              --data-binary "@$f" "$API/releases/$id/assets?name=$(jq -rn --arg n "$name" '$n|@uri')" >/dev/null
          done
