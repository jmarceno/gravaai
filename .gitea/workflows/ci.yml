name: CI

# Arch-only hard fork: all jobs run on manual dispatch only.
on:
  workflow_dispatch:

jobs:
  # ── Python lint + type check ────────────────────────────────────────────────
  #
  # ruff enforces lint + formatting repo-wide; mypy runs in strict mode on the
  # headless packages (processing/, services/, config/ — see pyproject.toml).
  lint-python:
    name: Python lint + type check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install ruff and mypy
        run: pip install ruff mypy

      - name: ruff lint
        run: ruff check linux/

      - name: ruff format check
        run: ruff format --check linux/

      - name: mypy (strict packages)
        run: >-
          mypy
          linux/src/meeting_recorder/processing
          linux/src/meeting_recorder/services
          linux/src/meeting_recorder/config

  # ── Unit tests ──────────────────────────────────────────────────────────────
  #
  # Manual run only. No system dependencies required — all shell/network
  # calls are replaced with fakes via the services' dependency-injection hooks.
  unit-tests:
    name: Unit tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install pytest
        run: pip install pytest pytest-cov

      - name: Run tests (with coverage)
        run: >-
          pytest --tb=short
          --cov=meeting_recorder
          --cov-report=term
          --cov-report=xml:coverage.xml

      # Report-only for now — no threshold gate. The artifact makes coverage
      # visible per manual run so regressions in the extracted core/ modules show up.
      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: python-coverage-${{ matrix.python-version }}
          path: coverage.xml

  # ── Pacman package build smoke test (Arch only) ─────────────────────────────
  #
  # Verifies that the Arch packaging toolchain produces a structurally valid
  # artifact. Each job runs inside a matching Arch container so makepkg is
  # available. x86_64 uses the official image; arm64 uses the community
  # Arch Linux ARM image (no official arm64 image exists).
  package-build:
    name: ${{ matrix.arch }} Build pacman package + install smoke test
    runs-on: ${{ matrix.runner }}
    needs: unit-tests
    strategy:
      fail-fast: false
      matrix:
        include:
          - container: archlinux:latest
            arch: X86_64
            runner: ubuntu-latest
          - container: menci/archlinuxarm:latest
            arch: arm64
            runner: ubuntu-24.04-arm
    container: ${{ matrix.container }}

    steps:
      - name: Install pacman build tools
        run: |
          # pacman 7's Landlock download sandbox cannot be applied inside
          # Docker containers. The official x86 archlinux image ships with it
          # disabled; the community ALARM image does not, so disable it here
          # (it broke dependency downloads during pacman -U).
          sed -i '/^\[options\]/a DisableSandbox' /etc/pacman.conf
          pacman -Syu --noconfirm git base-devel

      - uses: actions/checkout@v6

      - name: Build pacman package
        run: |
          mkdir -p arch-build

          SRCDIR=$(mktemp -d)
          mkdir "${SRCDIR}/meeting-recorder-0.0.0"
          cp -r linux "${SRCDIR}/meeting-recorder-0.0.0/"
          tar -czf arch-build/meeting-recorder-0.0.0.tar.gz \
            -C "${SRCDIR}" meeting-recorder-0.0.0

          sed "s/@VERSION@/0.0.0/g" linux/packaging/arch/PKGBUILD > arch-build/PKGBUILD
          cp linux/packaging/arch/meeting-recorder.install arch-build/

          useradd -m builder
          chown -R builder:builder arch-build
          su builder -c "cd arch-build && makepkg --noconfirm --skipinteg --nodeps"

      - name: Verify pacman package structure
        run: |
          bsdtar -tf arch-build/*.pkg.tar.* | grep -q usr/bin/meeting-recorder
          bsdtar -tf arch-build/*.pkg.tar.* | grep -q opt/meeting-recorder/linux/src
          bsdtar -tf arch-build/*.pkg.tar.* | grep -q opt/meeting-recorder/requirements.lock
          bsdtar -tf arch-build/*.pkg.tar.* | grep -q usr/share/applications/io.github.jmarceno.Gravaai.desktop
          bsdtar -tf arch-build/*.pkg.tar.* | grep -q usr/share/icons/hicolor/256x256/apps/meeting-recorder.png
          echo "All required paths present in pacman package"

      # Install with the real depends array (pacman -U resolves them), which
      # runs post_install (venv + pip from the lock), then import the app the
      # way the launcher does.
      - name: Install pacman package and import smoke test
        run: |
          pacman -U --noconfirm arch-build/*.pkg.tar.*
          PYTHONPATH=/opt/meeting-recorder/linux/src \
            /opt/meeting-recorder/venv/bin/python - <<'EOF'
          import gi
          gi.require_version("Gtk", "4.0")
          gi.require_version("Adw", "1")
          from gi.repository import Gtk, Adw
          import google.genai
          import meeting_recorder
          print("GTK4 + Adw typelibs, venv deps, and app package all import OK")
          EOF
