[package]
name = "gravaai"
version = "0.1.0"
edition = "2021"
description = "GravaAi — meeting recorder, transcriber and organizer for Linux"
license = "MIT"

[[bin]]
name = "gravaai"
path = "src/main.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
chrono = { version = "0.4", features = ["clock"] }
regex = "1"
dirs = "5"
log = "0.4"
env_logger = "0.11"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "multipart", "rustls-tls"] }
tokio = { version = "1", features = ["full"] }
futures-lite = "2"
zbus = { version = "5", default-features = false, features = ["tokio"] }
ksni = "0.3"
png = "0.17"
zip = { version = "2", default-features = false, features = ["deflate"] }
keyring = "3"
tempfile = "3"
gtk = { version = "0.9", optional = true, package = "gtk4", features = ["v4_18"] }
adw = { version = "0.7", optional = true, package = "libadwaita", features = ["v1_7"] }
glib = { version = "0.20", optional = true }
gio = { version = "0.20", optional = true }

[features]
default = ["ui"]
ui = ["gtk", "adw", "glib", "gio"]

[dev-dependencies]
tempfile = "3"
