name: Release

# AppImage hard fork: manual dispatch only. Provide a version (without the
# leading v, e.g. 1.2.3) or, when called via workflow_call, pass it as input.

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version (without v prefix, e.g. 1.2.3)'
        required: true
        type: string
  workflow_call:
    inputs:
      version:
        description: 'Release version (without v prefix, e.g. 1.2.3)'
        required: true
        type: string

jobs:
  get-version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.VERSION }}
    steps:
      - id: v
        run: |
          echo "VERSION=${{ inputs.version }}" >> "$GITHUB_OUTPUT"

  build-appimage:
    needs: get-version
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-latest
          - arch: aarch64
            runner: ubuntu-24.04-arm
    env:
      VERSION: ${{ needs.get-version.outputs.version }}
    steps:
      - uses: actions/checkout@v6

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential curl file desktop-file-utils \
            libgtk-4-dev libadwaita-1-dev libpulse-dev libglib2.0-dev

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Build AppImage
        run: |
          # Nested AppImage hosts / CI runners often lack usable FUSE.
          export APPIMAGE_EXTRACT_AND_RUN=1
          unset APPIMAGE APPDIR || true
          ./linux/packaging/appimage/build-appimage.sh "$VERSION" \
            "$PWD/appimage-out"

      - name: Smoke-test AppImage
        run: |
          unset APPIMAGE APPDIR || true
          export APPIMAGE_EXTRACT_AND_RUN=1
          IMG="appimage-out/gravaai-${VERSION}-${{ matrix.arch }}.AppImage"
          test -x "$IMG"
          # Role flags refuse garbage outside the daemon — exit 2 means the
          # binary ran and parsed argv (same check the old pacman smoke used).
          "$IMG" --install 'garbage' || test $? -eq 2
          echo "AppImage runs OK"

      - uses: actions/upload-artifact@v4
        with:
          name: appimage-${{ matrix.arch }}
          path: appimage-out/gravaai-*.AppImage

  release:
    needs: [get-version, build-appimage]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      VERSION: ${{ needs.get-version.outputs.version }}
    steps:
      - uses: actions/checkout@v6

      - name: Download AppImage artifacts
        uses: actions/download-artifact@v4
        with:
          merge-multiple: true

      - name: Create source tarball
        run: |
          SRC=$(mktemp -d)
          cp -r . "${SRC}/gravaai-${VERSION}"
          rm -rf \
            "${SRC}/gravaai-${VERSION}/.git" \
            "${SRC}/gravaai-${VERSION}/.claude" \
            "${SRC}/gravaai-${VERSION}/gh-pages-dir" \
            "${SRC}/gravaai-${VERSION}/linux/target" \
            "${SRC}/gravaai-${VERSION}/linux/packaging/appimage/out" \
            "${SRC}/gravaai-${VERSION}/linux/packaging/appimage/.tools" \
            "${SRC}/gravaai-${VERSION}/target"
          tar -czf "gravaai_${VERSION}.tar.gz" -C "${SRC}" "gravaai-${VERSION}"

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.get-version.outputs.version }}
          files: |
            gravaai-*.AppImage
            gravaai_*.tar.gz
          generate_release_notes: true
