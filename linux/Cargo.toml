[package]
name = "gravaai"
version = "0.1.0"
edition = "2021"
description = "GravaAi — meeting recorder, transcriber and organizer for Linux"
license = "MIT"
build = "build.rs"

[lib]
name = "gravaai"
path = "src/lib.rs"

[[bin]]
name = "gravaai"
path = "src/main.rs"

[[bin]]
name = "gravaai-ui"
path = "src/bin/gravaai-ui.rs"
required-features = ["ui"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
chrono = { version = "0.4", features = ["clock"] }
regex = "1"
dirs = "5"
log = "0.4"
env_logger = "0.11"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "multipart", "rustls-tls"] }
tokio = { version = "1", features = ["full"] }
futures-lite = "2"
zbus = { version = "5", default-features = false, features = ["tokio", "blocking-api"] }
ksni = "0.3"
png = "0.17"
zip = { version = "2", default-features = false, features = ["deflate"] }
tar = "0.4"
flate2 = "1"
keyring = "3"
tempfile = "3"
cxx = { version = "=1.0.176", optional = true }
cxx-qt = { version = "=0.10.0", optional = true }
cxx-qt-lib = { version = "=0.10.0", optional = true, features = ["qt_gui", "qt_qml", "qt_quickcontrols"] }

[features]
default = []
ui = ["dep:cxx", "dep:cxx-qt", "dep:cxx-qt-lib"]

[build-dependencies]
cxx-qt-build = { version = "=0.10.0", features = ["link_qt_object_files"] }
cxx-gen = { version = "=0.7.176" }

[dev-dependencies]
tempfile = "3"
